
    

<body class="min-h-full flex flex-col text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">

                </div>

                    <i class="fa-solid fa-users text-slate-500"></i>
                    <span>學生名單</span>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2"></div>

    <!-- Main Container -->

        <!-- TAB 1: ROSTER MANAGEMENT (學生名單管理) -->
        <section id="tab-roster" class="hidden space-y-6">
            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">

                    </div>
                </div>

                <!-- Visualized Grouping Results Canvas Grid -->
                <div class="space-y-4">

                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2 font-rounded">
                            <i class="fa-solid fa-shapes text-cyan-500"></i> 分組結果展示
                        </h3>

                        <!-- Export / Copy Tools -->
                        <div id="group-tools" class="hidden flex items-center gap-2">
                            <button onclick="copyGroupResultText()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-all flex items-center gap-1">

                            <i class="fa-solid fa-layer-group text-4xl"></i>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
        <p>班級隨機抽籤與智慧分組神器 &copy; 老師教學好幫手｜設計優化為大螢幕與簡報投影使用</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Global Application State
        let roster = [];                  // Full student list
        let pickerPool = [];              // Remaining students for non-repeating draw
        let drawnHistory = [];            // List of drawn students in order
        let soundEnabled = true;          // Sound SFX toggle
        let isSpinning = false;           // Spin state lock
        let repeatMode = 'allow';         // 'allow' or 'no-repeat'
        let currentTab = 'tab-picker';    // active tab ID

        // Web Audio API Synthesizer (No external audio files required!)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        // Web Audio sound effects
        function playTickSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                // Graceful fallback
            }
        }

        function playFanfareSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + (idx * 0.08);
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } catch (e) {
                // Graceful fallback
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-indigo-500';
                text.innerText = '音效開啟';
                playTickSound();
                showToast('🔊 抽籤音效已開啟');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '靜音模式';
                showToast('🔇 音效已關閉');
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl animate-bounce-short flex items-center gap-2 border border-slate-700 font-sans';
            toast.innerHTML = `<span>✨</span> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2500);
        }

        // Preset sample rosters
        const preset25Names = [
            '陳冠宇', '林子涵', '張威勝', '黃雅婷', '李柏翰',
            '王依婷', '吳家豪', '劉宇軒', '蔡佳穎', '楊承翰',
            '許沛蓁', '鄭智翔', '謝佳霖', '郭秉勳', '洪詩涵',
            '曾品叡', '廖育安', '賴星羽', '徐佑嘉', '周芯語',
            '葉家銘', '蘇郁晴', '莊哲瑋', '江羽婷', '蕭博元'
        ];

        window.onload = function() {
            // Load roster from localStorage or default preset
            const saved = localStorage.getItem('teacher_app_roster');
            if (saved) {
                try {
                    roster = JSON.parse(saved);
                } catch(e) {
                    roster = [...preset25Names];
                }
            } else {
                roster = [...preset25Names];
            }

            // Sync initial state
            updateRosterUI();
            resetPickerPool();

            // Keyboard shortcut: Spacebar to spin
            window.addEventListener('keydown', function(e) {
                if (e.code === 'Space' && currentTab === 'tab-picker') {
                    // Avoid triggering space on inputs
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
                    e.preventDefault();
                    triggerDraw();
                }
            });
        };

        function switchTab(tabId) {
            currentTab = tabId;
            ['tab-roster', 'tab-picker', 'tab-grouping'].forEach(t => {
                const sec = document.getElementById(t);
                const nav = document.getElementById(`nav-${t.replace('tab-', '')}`);
                if (t === tabId) {
                    sec.classList.remove('hidden');
                    nav.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-indigo-600 bg-white shadow-sm transition-all flex items-center gap-1.5';
                } else {
                    sec.classList.add('hidden');
                    nav.className = 'px-3 sm:px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5';
                }
            });
        }

        // CSV File Uploader & Parser
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                parseAndSetNames(text);
                showToast(`📄 成功讀取檔案: ${file.name}`);
            };
            reader.readAsText(file, 'UTF-8');
        }

        function parseAndSetNames(rawText) {
            // Split by newlines or commas or semicolons
            const names = rawText
                .split(/[\r\n,;]+/)
                .map(n => n.trim().replace(/^["']|["']$/g, ''))
                .filter(n => n.length > 0 && n.toLowerCase() !== '姓名' && n.toLowerCase() !== 'name');

            if (names.length === 0) {
                showToast('⚠️ 未能讀取到有效學生姓名');
                return;
            }

            roster = names;
            saveRosterToStorage();
            updateRosterUI();
            resetPickerPool();
        }

        function saveRosterFromInput() {
            const val = document.getElementById('roster-textarea').value;
            parseAndSetNames(val);
            showToast('💾 學生名單已更新並儲存！');
        }

        function loadPresetRoster(presetKey) {
            if (presetKey === 'sample30') {
                roster = [...preset25Names];
                saveRosterToStorage();
                updateRosterUI();
                resetPickerPool();
                showToast('✨ 已載入 25 人示範名單');
            }
        }

        function clearRoster() {
            roster = [];
            saveRosterToStorage();
            updateRosterUI();
            resetPickerPool();
            showToast('🗑️ 名單已清空');
        }

        function saveRosterToStorage() {
            localStorage.setItem('teacher_app_roster', JSON.stringify(roster));
        }

        function shuffleRosterOrder() {
            roster = fisherYatesShuffle(roster);
            saveRosterToStorage();
            updateRosterUI();
            resetPickerPool();
            showToast('🎲 已隨機打亂名單順序');
        }

        function updateRosterUI() {
            // Update textarea text
            document.getElementById('roster-textarea').value = roster.join('\n');
            document.getElementById('input-char-count').innerText = `${roster.length} 人`;

            // Update badge counts
            document.getElementById('roster-count-badge').innerText = roster.length;
            document.getElementById('preview-badge').innerText = `${roster.length} 人`;
            document.getElementById('pool-total-count').innerText = roster.length;
            document.getElementById('grouping-total-count').innerText = roster.length;

            // Render Preview Chips
            const previewContainer = document.getElementById('roster-preview-list');
            if (roster.length === 0) {
                previewContainer.innerHTML = `
                    <div class="text-center py-12 text-slate-400 space-y-2">
                        <i class="fa-solid fa-users-slash text-3xl"></i>
                        <p class="text-xs">尚無學生名單，請在左側輸入或上傳</p>
                    </div>`;
            } else {
                previewContainer.innerHTML = roster.map((name, idx) => `
                    <div class="flex items-center justify-between bg-white px-3.5 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 shadow-sm">
                        <span class="flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full bg-slate-100 text-slate-500 text-[10px] flex items-center justify-center font-mono">${idx + 1}</span>
                            <span>${name}</span>
                        </span>
                        <button onclick="removeSingleStudent(${idx})" class="text-slate-300 hover:text-rose-500 transition-colors">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `).join('');
            }
        }

        function removeSingleStudent(idx) {
            roster.splice(idx, 1);
            saveRosterToStorage();
            updateRosterUI();
            resetPickerPool();
        }

        // Random Picker Core Logic
        function setRepeatMode(mode) {
            repeatMode = mode;
            resetPickerPool();
        }

        function resetPickerPool() {
            pickerPool = [...roster];
            document.getElementById('pool-remain-count').innerText = pickerPool.length;
            document.getElementById('picker-status-text').innerText = '點擊下方按鈕或按下 [ 空白鍵 ] 開始抽籤';
        }

        function clearHistoryLog() {
            drawnHistory = [];
            renderHistoryLog();
        }

        function triggerDraw() {
            if (isSpinning) return;
            if (roster.length === 0) {
                showToast('⚠️ 請先新增學生名單再開始抽籤！');
                switchTab('tab-roster');
                return;
            }

            // Check pool if no-repeat
            if (repeatMode === 'no-repeat' && pickerPool.length === 0) {
                showToast('🎉 所有學生均已抽過一輪囉！已自動重置抽籤池。');
                resetPickerPool();
            }

            const currentPool = (repeatMode === 'no-repeat') ? pickerPool : roster;
            if (currentPool.length === 0) return;

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('spin-btn').classList.add('opacity-50', 'cursor-not-allowed');

            const displayEl = document.getElementById('picker-display-name');
            const statusTag = document.getElementById('picker-status-text');
            statusTag.innerText = '隨機滾動中...';

            // Decelerating Spin Animation Parameters
            let counter = 0;
            let totalSteps = 28 + Math.floor(Math.random() * 8); // ~35 steps
            let speed = 40; // initial speed ms

            // Random winner selection
            const winnerIndex = Math.floor(Math.random() * currentPool.length);
            const winnerName = currentPool[winnerIndex];

            function spinStep() {
                // Pick a random temp candidate to show during spin
                const randomCandidate = currentPool[Math.floor(Math.random() * currentPool.length)];
                displayEl.innerText = randomCandidate;
                displayEl.classList.remove('scale-110', 'text-amber-300');
                displayEl.classList.add('scale-95', 'opacity-80');

                playTickSound();

                counter++;
                if (counter < totalSteps) {
                    // Gradually slow down
                    if (counter > totalSteps - 12) speed += 25;
                    else if (counter > totalSteps - 6) speed += 50;
                    setTimeout(spinStep, speed);
                } else {
                    // Finish & Reveal Winner
                    displayEl.innerText = winnerName;
                    displayEl.classList.remove('scale-95', 'opacity-80');
                    displayEl.classList.add('scale-110', 'text-amber-300');

                    playFanfareSound();

                    // Confetti Celebration
                    confetti({
                        particleCount: 80,
                        spread: 60,
                        origin: { y: 0.6 }
                    });

                    statusTag.innerText = `🎉 恭喜抽中：${winnerName}`;

                    // Update Pool & History
                    if (repeatMode === 'no-repeat') {
                        pickerPool.splice(winnerIndex, 1);
                        document.getElementById('pool-remain-count').innerText = pickerPool.length;
                    }

                    drawnHistory.unshift({
                        name: winnerName,
                        time: new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
                    });
                    renderHistoryLog();

                    // Unlock Spin
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    document.getElementById('spin-btn').classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }

            spinStep();
        }

        function renderHistoryLog() {
            const container = document.getElementById('history-log-container');
            document.getElementById('history-count').innerText = drawnHistory.length;

            if (drawnHistory.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-400 italic">尚無抽中紀錄...</span>`;
                return;
            }

            container.innerHTML = drawnHistory.map((item, idx) => `
                <div class="bg-white px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800 shadow-sm flex items-center gap-2 font-rounded animate-bounce-short">
                    <span class="w-4 h-4 rounded-full bg-amber-100 text-amber-700 text-[10px] flex items-center justify-center font-black">${drawnHistory.length - idx}</span>
                    <span class="text-indigo-600">${item.name}</span>
                    <span class="text-[10px] text-slate-400 font-normal">${item.time}</span>
                </div>
            `).join('');
        }

        // Auto Grouping Logic
        function toggleGroupRuleInput() {
            const type = document.getElementById('group-rule-type').value;
            const label = document.getElementById('group-number-label');
            const unit = document.getElementById('group-unit-text');

            if (type === 'per-group') {
                label.innerText = '2. 每組人數：';
                unit.innerText = '人 / 組';
            } else {
                label.innerText = '2. 總共組數：';
                unit.innerText = '組';
            }
        }

        function fisherYatesShuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Group Naming Themes
        const themePresets = {
            numeric: idx => `第 ${idx + 1} 組`,
            animals: idx => ['🦁 獅子組', '🐧 企鵝組', '🐼 大熊貓組', '🦊 奇幻狐狸組', '🐬 藍海豚組', '🐨 考拉組', '🦉 智慧貓頭鷹組', '🐯 勇猛老虎組'][idx % 8] || `小組 ${idx + 1}`,
            sweets: idx => ['🧋 珍珠奶茶組', '🥐 酥翠可頌組', '🍰 提拉米蘇組', '🍓 草莓蛋糕組', '🍩 甜甜圈組', '馬卡龍組', '🍧 芒果刨冰組', '鬆餅組'][idx % 8] || `小組 ${idx + 1}`,
            colors: idx => ['🔴 紅寶石隊', '🔵 翡翠藍隊', '🟡 琥珀金隊', '🟢 森林綠隊', '🟣 紫水晶隊', '橙日光隊', '粉櫻花隊', '⚪ 白銀隊'][idx % 8] || `小組 ${idx + 1}`,
        };

        let currentGeneratedGroups = [];

        function generateGroups() {
            if (roster.length === 0) {
                showToast('⚠️ 請先新增學生名單再進行分組！');
                switchTab('tab-roster');
                return;
            }

            const ruleType = document.getElementById('group-rule-type').value;
            const inputVal = parseInt(document.getElementById('group-number-input').value) || 1;
            const themeKey = document.getElementById('group-theme-select').value;
            const assignLeader = document.getElementById('assign-leader-checkbox').checked;

            const shuffledStudents = fisherYatesShuffle(roster);
            let groups = [];

            if (ruleType === 'per-group') {
                const perGroup = Math.max(1, inputVal);
                const groupCount = Math.ceil(shuffledStudents.length / perGroup);
                
                for (let i = 0; i < groupCount; i++) {
                    groups.push(shuffledStudents.slice(i * perGroup, (i + 1) * perGroup));
                }
            } else {
                // Total groups
                const totalGroups = Math.max(1, Math.min(inputVal, shuffledStudents.length));
                for (let i = 0; i < totalGroups; i++) {
                    groups.push([]);
                }
                // Distribute evenly
                shuffledStudents.forEach((student, idx) => {
                    groups[idx % totalGroups].push(student);
                });
            }

            // Structure formatted result
            const nameGenerator = themePresets[themeKey] || themePresets.numeric;
            currentGeneratedGroups = groups.map((members, idx) => {
                let leaderName = null;
                if (assignLeader && members.length > 0) {
                    leaderName = members[Math.floor(Math.random() * members.length)];
                }
                return {
                    name: nameGenerator(idx),
                    members: members,
                    leader: leaderName
                };
            });

            playFanfareSound();
            renderGroupResults();
            document.getElementById('group-tools').classList.remove('hidden');
            showToast('✨ 完成自動分組！');
        }

        function renderGroupResults() {
            const grid = document.getElementById('group-cards-grid');

            if (currentGeneratedGroups.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-slate-50 rounded-3xl border border-dashed border-slate-200 text-slate-400 space-y-2">
                        <i class="fa-solid fa-layer-group text-4xl"></i>
                        <p class="text-xs font-bold">請設定條件後點擊「開始自動分組」</p>
                    </div>`;
                return;
            }

            // Colors for Group Card Header Accents
            const cardGradients = [
                'from-indigo-500 to-indigo-600',
                'from-cyan-500 to-cyan-600',
                'from-amber-500 to-amber-600',
                'from-emerald-500 to-emerald-600',
                'from-rose-500 to-rose-600',
                'from-purple-500 to-purple-600',
            ];

            grid.innerHTML = currentGeneratedGroups.map((grp, idx) => {
                const gradClass = cardGradients[idx % cardGradients.length];

                return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col transition-all hover:shadow-md">
                    <!-- Group Header -->
                    <div class="bg-gradient-to-r ${gradClass} p-3.5 text-white flex items-center justify-between">
                        <h4 class="font-bold text-sm font-rounded flex items-center gap-2">
                            <span>${grp.name}</span>
                        </h4>
                        <span class="bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-xs">
                            ${grp.members.length} 人
                        </span>
                    </div>

                    <!-- Members List -->
                    <div class="p-4 space-y-2 flex-grow bg-slate-50/50">
                        ${grp.members.map(member => {
                            const isLeader = (member === grp.leader);
                            return `
                            <div class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border ${isLeader ? 'border-amber-300 bg-amber-50/40 shadow-xs' : 'border-slate-200'} text-xs font-bold text-slate-800">
                                <span class="flex items-center gap-2">
                                    <i class="fa-solid fa-user text-slate-300"></i>
                                    <span>${member}</span>
                                </span>
                                ${isLeader ? '<span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full border border-amber-200">👑 組長</span>' : ''}
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }).join('');
        }

        function copyGroupResultText() {
            if (currentGeneratedGroups.length === 0) return;

            let text = `📋 【班級分組結果】 (共 ${roster.length} 人)\n`;
            text += `========================\n`;

            currentGeneratedGroups.forEach(grp => {
                text += `\n【${grp.name}】 (${grp.members.length}人)\n`;
                grp.members.forEach(m => {
                    text += `  - ${m}${m === grp.leader ? ' (👑組長)' : ''}\n`;
                });
            });

            // Copy to clipboard fallback handler
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('📋 分組結果文字已複製到剪貼簿！');
        }
    </script>
</body>
</html>
